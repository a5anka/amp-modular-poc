# Two replicas of the core on one Postgres. Install a module through either
# replica and watch the other one pick it up (LISTEN/NOTIFY), with no restart.
#
#   docker compose up --build
#   open http://localhost:8080 and http://localhost:8081
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  amp-1:
    build: .
    environment:
      AMP_DB_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      AMP_REPLICA: amp-1
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  amp-2:
    build: .
    environment:
      AMP_DB_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      AMP_REPLICA: amp-2
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
