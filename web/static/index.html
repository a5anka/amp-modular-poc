<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Manager (modular PoC)</title>
  <link rel="stylesheet" href="/style.css">
  <!--
    Shared singletons. The shell and every module bundle import these bare
    specifiers, and the browser resolves them to ONE copy served by the core.
    That is what lets a module ship a tiny ESM bundle with no React/Preact,
    no SDK and no state of its own, and still share hooks, context and the
    module registry with the shell. Production would map react, react-dom,
    @wso2/oxygen-ui, @tanstack/react-query and the api-client the same way.
  -->
  <script type="importmap">
  {
    "imports": {
      "preact": "/vendor/preact.js",
      "preact/hooks": "/vendor/hooks.js",
      "htm": "/vendor/htm.js",
      "@amp/ui-sdk": "/sdk/ui-sdk.js"
    }
  }
  </script>
  <script type="module" src="/shell.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
